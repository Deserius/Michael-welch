<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Signing in — Da RoastBox</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #130c0b; color: #f8eee9; font: 16px system-ui, sans-serif; }
    main { max-width: 28rem; padding: 2rem; text-align: center; }
    h1 { font-size: 1.35rem; color: #ff8a50; }
    p { line-height: 1.5; }
    a { color: #ffb18b; }
  </style>
</head>
<body>
  <main>
    <h1>Da RoastBox</h1>
    <p id="status" role="status">Finishing your Google sign-in…</p>
    <p id="return" hidden><a href="/">Return to Da RoastBox</a></p>
  </main>
  <script src="/auth-complete.js" defer></script>
</body>
</html>
